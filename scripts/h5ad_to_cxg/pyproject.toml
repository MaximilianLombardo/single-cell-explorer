[project]
name = "h5ad-to-cxg"
version = "0.1.0"
description = "Convert an .h5ad file into a CXG directory that Explorer can serve"
# Deliberately a SEPARATE uv project from the repo root, not a dependency group.
#
# The converter needs cellxgene-schema, which requires anndata>=0.11, while the
# server pins anndata==0.10.9. uv can express that as conflicting groups, but
# conflicting groups cannot be installed into the same environment at once -- and
# the normal workflow is to have the server running *and* the converter usable.
# Two projects means two .venv directories that coexist. The converter is a
# build-time tool, so it has no reason to share the server's runtime env anyway.
requires-python = ">=3.11"
dependencies = [
    "cellxgene-schema>=7.0.0",
    "dask>=2024.12.0",
    "numpy>=1.24.0",
    # Same tiledb<3.0 pandas constraint as the server: tiledb enforces it at runtime
    # for its dataframe API without declaring it, and the converter writes dataframes.
    "pandas>=2.2.0,<3.0.0",
    "psutil>=5.9.0",
    "scipy>=1.14.0",
    "tiledb>=0.34.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Only needed for spatial (pyvips, Pillow, boto3) or ATAC (pysam) datasets. The
# vendored code imports these lazily, so plain scRNA conversions do not need them.
spatial = ["pyvips>=2.2.0", "Pillow>=10.0.0", "boto3>=1.26.0"]
atac = ["pysam>=0.22.0"]

[tool.uv]
package = false
