name: Delete an RDev Stack

# DISABLED ON THIS FORK: needs CZI self-hosted ARM64 runners and CZI AWS accounts.
# Trigger reduced to manual dispatch so it does not fire automatically. Restore the
# original `on:` block (see git history) once there is equivalent infrastructure of
# our own to deploy to.
on:
  workflow_dispatch:

jobs:
  delete-rdev-stack:
    runs-on: ARM64
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'stack') || github.event.pull_request.state == 'closed' }}
    permissions:
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Delete Stack
        uses: chanzuckerberg/argus-artifacts/ci/packages/delete-stack@v0
        with:
          appName: single-cell-explorer
          envName: rdev
