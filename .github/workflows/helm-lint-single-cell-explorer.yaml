name: "Lint argus helm chart - single-cell-explorer"

# DISABLED ON THIS FORK: lints CZI Argus charts that target CZI-owned ECR.
# Trigger reduced to manual dispatch so it does not fire automatically. Restore the
# original `on:` block (see git history) once there is equivalent infrastructure of
# our own to deploy to.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: chanzuckerberg/github-actions/.github/actions/helm-lint@v6
        with:
          chart_path: .infra/prod
          values_files: ../common.yaml,./values.yaml
  lint-rdev:
    runs-on: ubuntu-latest
    steps:
      - uses: chanzuckerberg/github-actions/.github/actions/helm-lint@v6
        with:
          chart_path: .infra/rdev
          values_files: ../common.yaml,./values.yaml
  lint-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: chanzuckerberg/github-actions/.github/actions/helm-lint@v6
        with:
          chart_path: .infra/staging
          values_files: ../common.yaml,./values.yaml

