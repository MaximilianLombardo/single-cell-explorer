name: Push Tests

on:
  # Runs on every branch, not just main. Upstream relied on PRs to trigger this, but
  # a solo fork pushes directly to feature branches most of the time, which matched
  # neither trigger and meant no CI ran at all.
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

env:
  JEST_ENV: prod
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  SKIP_ATAC_CACHE: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --depth=1 origin +${{github.base_ref}}
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Node cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.0
      - name: Install client dependencies
        run: |
          cd client
          npm install
      - name: Lint src with eslint
        working-directory: ./client
        run: |
          npm run lint
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dev dependencies
        run: make dev-env-server
      - name: Verify the committed locks still resolve
        run: make check-locks
      # We can't have mypy in the pre-commit hook without having it run on all files
      # in the repo, because (probably) the --all-files argument in pre-commit overrides
      # the more narrow specifying of files in pyproject.toml
      # TODO: Remove this if/when all files are mypy-compliant
      - name: Run mypy
        run: uv run mypy --config-file pyproject.toml

  # Client unit tests (everything under client/__tests__ except e2e). These run as
  # the "unit" Playwright project and use no browser fixture, so no browser binaries
  # are needed and the whole suite finishes in ~20s.
  #
  # This job exists because the suite had no runner at all for a long time: jest was
  # dropped from the dependencies while the Makefile target still invoked it, and
  # Playwright's projects matched only the e2e files. Nothing caught, for example, a
  # 2022 change to the ColorTable.rgb memory layout that left its tests asserting
  # against a shape which no longer existed. Keep this job wired up or the suite will
  # silently rot again.
  unit-test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: "client/.nvmrc"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"
      - name: Install client dependencies
        working-directory: ./client
        # Puppeteer's chromium download is not needed here and fails on some runners
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Run client unit tests
        working-directory: ./client
        run: npm run test

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # uv provisions the interpreter itself from requires-python in pyproject.toml,
      # so there is no setup-python step and no separate pip cache to key on.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: "client/.nvmrc"
          cache: "npm"
          cache-dependency-path: "client/package-lock.json"
      - name: Install dependencies
        run: make dev-env-server build-for-server-dev
      - name: Unit tests
        run: |
          make unit-test-server
      # Skipped unless a CODECOV_TOKEN secret is configured. Without one the action
      # fails and takes the whole job red even when every test passed, which buries
      # the signal we actually care about.
      - name: Upload coverage reports to Codecov with GitHub Action
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4.2.0
        with:
          root_dir: ../
          flags: server,python,unitTest
          verbose: true
          commit_parent: false
          directory: server/
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
