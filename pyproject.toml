[project]
name = "cellxgene-explorer-server"
# release-please tracks the canonical version in .release-please-manifest.json;
# this mirrors it and is not auto-synced.
version = "1.20.2"
description = "CZ CELLxGENE Explorer server"
requires-python = ">=3.12"
dependencies = [
    "anndata==0.10.9",
    "bitarray==2.7.3",
    "boto3==1.26.94",
    # Provides distutils compatibility for Python 3.12 (required by fsspec<0.8.0)
    "setuptools>=65.5.1",
    "click==8.1.3",
    "envyaml==1.10.211231",
    "flask==2.2.5",
    "flask-compress==1.13",
    "flask-cors==5.0.0",
    "flask-restful==0.3.9",
    "flask-talisman==1.0.0",
    # flatbuffers generation has not been tested on any version > 2.0.0 yet
    "flatbuffers==2.0.7",
    "flatten-dict==0.4.2",
    "fsspec>=0.4.4,<0.8.0",
    "gunicorn[gevent]==22.0.0",
    "numba==0.60.0",
    "numpy>=1.24.0,<2.1.0",
    # tiledb 0.34.0 enforces pandas<3.0 at runtime for its dataframe API but does not
    # declare it, so an unbounded pin resolves to pandas 3.x and breaks the ATAC
    # coverage endpoint with "Pandas version >= 1.0 and < 3.0 required".
    "pandas>=2.2.2,<3.0.0",
    "pyarrow==15.0.2",
    "pydantic==2.9.2",
    "requests==2.32.3",
    "scipy==1.14.1",
    "flask-server-timing==0.1.2",
    "s3fs==0.4.2",
    "tiledb==0.34.0",
    "Werkzeug==3.0.6",
    "python-json-logger==2.0.7",
    "anthropic>=0.40.0",
]

[dependency-groups]
dev = [
    "Authlib>=0.14.3",
    "black>=22.3.0",
    "bumpversion>=0.5",
    "coverage>=7.2.3",
    "flake8>=4.0.0",
    "parameterized>=0.7.0",
    "psycopg2-binary>=2.8.5",
    "pytest>=3.6.3",
    "pytest-subtests>=0.5.0",
    "python-jose>=3.2.0",
    "twine>=1.12.1",
    # not directly required, pinned by Snyk to avoid a vulnerability
    "rsa>=4.7",
    "mypy",
    "types-requests",
    "types-setuptools",
    "typing_extensions",
    "types-PyYAML",
]

[tool.uv]
# This is an application, not a distributable library -- do not try to build it.
package = false

[tool.black]
line-length = 120
target_version = ['py38']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | backend/server/data_common/fbs/NetEncoding
  )/

)
'''

[tool.ruff]
select = ["E", "F", "B", "SIM", "C4", "I"]
ignore = ["E501", "E402", "C408", ]
line-length = 120
target-version = "py38"

[tool.mypy]
# here is where we tell mypy to only check the scripts package. note that we're using
# packages = ["server.common.utils"] instead of modules = ["server.common.utils"] because
# packages will recursively check subdirectories, while modules does not.
packages = ["server.common.utils"]
strict = true
show_error_codes = true
ignore_missing_imports = true
warn_unreachable = true
warn_unused_configs = true
